name: CI/CD - Test and Deploy Azure MCP Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run All Microservice Tests
        run: |
          chmod +x ./scripts/test-all.sh
          ./scripts/test-all.sh

  deploy-azure-mcp:
    name: Deploy Azure MCP Server
    needs: test
    # Opt-in: set the repository variable AZURE_DEPLOY_ENABLED=true once the OIDC federated credential exists.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC -> Entra federated credential; no stored Azure secret
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure login (GitHub OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure MCP Server
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_MCP_IDENTITY_ID: ${{ vars.AZURE_MCP_IDENTITY_ID }}
        run: |
          chmod +x ./scripts/deploy-azure-mcp.sh
          ./scripts/deploy-azure-mcp.sh
