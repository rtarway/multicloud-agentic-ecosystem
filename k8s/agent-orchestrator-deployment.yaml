apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent-system
data:
  # Cloud-Hosted MCP Endpoints (Azure App Service & Google Cloud Run)
  MCP_SERVER_URL: "https://az-mcp-server-ea223e.azurewebsites.net/mcp"
  GCP_MCP_SERVER_URL: "https://gcp-mcp-server-ur5vhsneiq-uc.a.run.app/mcp"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: agent-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: agent-system
  labels:
    app: agent-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
      annotations:
        # Architecture Requirement: Kept INSIDE SPIRE & Istio for cryptographic Workload Identity
        "sidecar.istio.io/inject": "true"
        "inject.spiffe.io/spire-agent": "true"
    spec:
      serviceAccountName: orchestrator-sa
      containers:
        - name: agent-orchestrator
          image: agent-orchestrator:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: oidc-config
                optional: true
          env:
            - name: PORT
              value: "3001"
            - name: ORCHESTRATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orchestrator-oidc
                  key: ORCHESTRATOR_CLIENT_SECRET
                  optional: true
            - name: MCP_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: MCP_SERVER_URL
                  optional: true
            - name: GCP_MCP_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: GCP_MCP_SERVER_URL
                  optional: true
            - name: GCP_PROJECT_ID
              value: "wifdemoproject-507002"
            - name: GCP_PROJECT_NUMBER
              value: "834200279688"
            - name: SPIRE_AGENT_SOCKET
              value: "/run/spire/sockets/agent.sock"
            - name: AGENT_SPIFFE_ID
              value: "spiffe://example.org/ns/agent-system/sa/orchestrator-sa"
            # DEMO PROFILE: identity is simulated. Remove ALLOW_SIMULATION to run the (not yet complete) real path.
            - name: ALLOW_SIMULATION
              value: "true"
            - name: DEPLOYMENT_ENV
              value: "demo"
            - name: DEMO_AZURE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-keys
                  key: DEMO_AZURE_PRIVATE_KEY
                  optional: true
            - name: DEMO_GOOGLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-keys
                  key: DEMO_GOOGLE_PRIVATE_KEY
                  optional: true

          volumeMounts:
            - name: identity-map
              mountPath: /etc/identity
              readOnly: true
            # Mount SPIRE Agent Workload API socket directly via SPIFFE CSI Driver
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: identity-map
          configMap:
            name: identity-map
            optional: true
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: agent-system
  labels:
    app: agent-orchestrator
spec:
  type: ClusterIP
  selector:
    app: agent-orchestrator
  ports:
    - name: http
      port: 3001
      targetPort: 3001
