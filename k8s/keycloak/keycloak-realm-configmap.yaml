apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  azure-wif-realm.json: |
    {
      "realm": "azure-wif-realm",
      "enabled": true,
      "displayName": "Azure Workload Identity Federation & Agentic Flow Realm",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Administrator with full access to tool1 and tool2 in MCP"
          },
          {
            "name": "regular-user",
            "description": "Regular user restricted to tool1 in MCP"
          }
        ]
      },
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@example.com",
          "firstName": "Alice",
          "lastName": "Administrator",
          "credentials": [
            {
              "type": "password",
              "value": "alicepassword",
              "temporary": false
            }
          ],
          "realmRoles": [
            "admin"
          ]
        },
        {
          "username": "bob",
          "enabled": true,
          "email": "bob@example.com",
          "firstName": "Bob",
          "lastName": "Operator",
          "credentials": [
            {
              "type": "password",
              "value": "bobpassword",
              "temporary": false
            }
          ],
          "realmRoles": [
            "regular-user"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "mcp:tool1",
          "description": "Scope permitting access to tool1 (app1 and app2 read/write)",
          "protocol": "openid-connect"
        },
        {
          "name": "mcp:tool2",
          "description": "Scope permitting access to tool2 (app1 read-only audit)",
          "protocol": "openid-connect"
        }
      ],
      "scopeMappings": [
        {
          "clientScope": "mcp:tool1",
          "roles": [
            "admin",
            "regular-user"
          ]
        },
        {
          "clientScope": "mcp:tool2",
          "roles": [
            "admin"
          ]
        }
      ],
      "clients": [
        {
          "clientId": "web-frontend-client",
          "name": "Web Frontend Application",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:3000/*",
            "http://127.0.0.1:3000/*"
          ],
          "webOrigins": [
            "*"
          ],
          "defaultClientScopes": [
            "web-origins",
            "roles",
            "profile",
            "email"
          ],
          "optionalClientScopes": [
            "mcp:tool1",
            "mcp:tool2"
          ]
        },
        {
          "clientId": "agent-orchestrator-client",
          "name": "Agent Orchestrator Service",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "orchestrator-secret-key-2026",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": true,
          "defaultClientScopes": [
            "roles",
            "profile",
            "email"
          ],
          "optionalClientScopes": [
            "mcp:tool1",
            "mcp:tool2"
          ],
          "protocolMappers": [
            {
              "name": "actor-spiffe-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "act.sub",
                "claim.value": "spiffe://example.org/ns/agent-system/sa/orchestrator-sa",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            },
            {
              "name": "mcp-audience-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "mcp-azure-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "mcp-azure-service",
          "name": "Azure MCP Resource Service",
          "enabled": true,
          "bearerOnly": true,
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "roles"
          ],
          "optionalClientScopes": [
            "mcp:tool1",
            "mcp:tool2"
          ],
          "protocolMappers": [
            {
              "name": "actor-spiffe-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "act.sub",
                "claim.value": "spiffe://example.org/ns/agent-system/sa/orchestrator-sa",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            },
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            },
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
