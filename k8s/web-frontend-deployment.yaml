apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: agent-system
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
      annotations:
        # Architecture Requirement: Kept OUTSIDE SPIRE so standard browsers can access directly
        "inject.spiffe.io/spire-agent": "false"
        "sidecar.istio.io/inject": "false"
    spec:
      containers:
        - name: web-frontend
          image: web-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: oidc-config
                optional: true
          env:
            - name: PORT
              value: "3000"
            - name: OIDC_CLIENT_ID
              value: "web-frontend"
            - name: OIDC_REDIRECT_URI
              value: "http://localhost:3000/auth/callback"
            - name: AGENT_ORCHESTRATOR_URL
              value: "http://agent-orchestrator.agent-system.svc.cluster.local:3001"
            - name: KEYCLOAK_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080"
            # DEMO PROFILE: identity is simulated. Remove ALLOW_SIMULATION to run the (not yet complete) real path.
            - name: ALLOW_SIMULATION
              value: "true"
            - name: DEPLOYMENT_ENV
              value: "demo"
            - name: DEMO_AZURE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-keys
                  key: DEMO_AZURE_PRIVATE_KEY
                  optional: true
            - name: DEMO_GOOGLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-keys
                  key: DEMO_GOOGLE_PRIVATE_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend-service
  namespace: agent-system
  labels:
    app: web-frontend
spec:
  type: NodePort
  selector:
    app: web-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
