apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gcp-server
  namespace: agent-system
  labels:
    app: mcp-gcp-server
    cloud: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gcp-server
  template:
    metadata:
      labels:
        app: mcp-gcp-server
        cloud: gcp
      annotations:
        "sidecar.istio.io/inject": "true"
    spec:
      containers:
        - name: mcp-gcp-server
          image: gcp-mcp-server:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: oidc-config
                optional: true
          env:
            - name: PORT
              value: "8081"
            - name: MCP_PROTOCOL_VERSION
              value: "2026-07-15"
            - name: GCP_PROJECT_ID
              value: "wifdemoproject-507002"

            - name: GCP_DATASET_ANALYTICS
              value: "analytics_data"
            - name: GCP_DATASET_AUDIT
              value: "audit_logs"
            # DEMO PROFILE: identity is simulated. Remove ALLOW_SIMULATION to run the (not yet complete) real path.
            - name: ALLOW_SIMULATION
              value: "true"
            - name: DEPLOYMENT_ENV
              value: "demo"
            - name: DEMO_GOOGLE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-keys
                  key: DEMO_GOOGLE_PUBLIC_KEY
                  optional: true
          volumeMounts:
            - name: identity-map
              mountPath: /etc/identity
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: identity-map
          configMap:
            name: identity-map
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: gcp-mcp-service
  namespace: agent-system
  labels:
    app: mcp-gcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-gcp-server
  ports:
    - name: http
      port: 8081
      targetPort: 8081
