# Non-secret identity configuration shared by the services (consumed with envFrom).
# The issuer is the PUBLIC Keycloak URL (what appears in every token's `iss`); the JWKS and token endpoints use the
# in-cluster URL. Secrets (the orchestrator's client secret) are NOT here: see scripts/sync-orchestrator-secret.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-config
  namespace: agent-system
data:
  OIDC_ISSUER: "http://localhost:8080/realms/azure-wif-realm"
  OIDC_JWKS_URI: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/azure-wif-realm/protocol/openid-connect/certs"
  OIDC_TOKEN_ENDPOINT: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/azure-wif-realm/protocol/openid-connect/token"
  # SPIRE's published OIDC discovery (must be reachable from the pods and from Azure); see scripts/publish-spire-oidc.sh
  SPIRE_OIDC_ISSUER: "https://azwifoidcpoc2026.blob.core.windows.net/spire-oidc"
  # Identity directory generated from identity/users.yaml and mounted from the identity-map ConfigMap
  IDENTITY_MAP_PATH: "/etc/identity/identity-map.json"
