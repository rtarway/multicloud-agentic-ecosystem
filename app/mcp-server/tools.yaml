# Low-Code Declarative MCP Tool Registry
# Tools are defined declaratively without writing imperative routing boilerplate.
# The MCP declarative engine automatically registers tools, enforces JSON schemas,
# evaluates required OAuth scopes, and dispatches storage operations.

version: "2026-07-15"
tools:
  - name: "tool1"
    title: "Storage Read/Write Tool for App1 and App2"
    description: "Allows reading and writing blobs in Azure Storage containers app1 and app2. Each call needs the matching delegated scope (Mcp.Storage.ReadApp1/ReadApp2/WriteApp1/WriteApp2) and the user's own Azure RBAC role on the container."
    # Entra delegated scope required per call: Mcp.Storage.{Read|Write}{App1|App2} (derived from action and container)
    target_backend: "azure_storage"
    allowed_containers:
      - "app1"
      - "app2"
    allowed_actions:
      - "read"
      - "write"
    inputSchema:
      type: "object"
      properties:
        container:
          type: "string"
          enum: ["app1", "app2"]
          description: "Target Azure Blob Storage container"
        action:
          type: "string"
          enum: ["read", "write"]
          description: "Storage action to perform"
        filename:
          type: "string"
          description: "Name of the blob file"
        content:
          type: "string"
          description: "Data content to write (required if action is write)"
      required:
        - "container"
        - "action"
        - "filename"
    fine_grained_policies:
      - id: "prevent_audit_tampering"
        description: "Prevents modifying compliance or audit files"
        effect: "DENY"
        condition: "args.action == 'write' && (args.filename.includes('compliance') || args.filename.includes('audit'))"
        message: "Fine-Grained Policy Denial: Compliance and audit records are immutable and cannot be overwritten."
      - id: "restricted_extensions"
        description: "Enforce allowed data file extensions"
        effect: "DENY"
        condition: "!args.filename.endsWith('.json') && !args.filename.endsWith('.txt') && !args.filename.endsWith('.yaml')"
        message: "Fine-Grained Policy Denial: Only .json, .txt, and .yaml files are permitted."

  - name: "tool2"
    title: "Auditing & Read-Only Tool for App1"
    description: "Provides read-only access strictly to the app1 container for system audits and management. Needs the delegated scope Mcp.Storage.ReadApp1 and the user's own Azure RBAC role on app1."
    # Entra delegated scope required per call: Mcp.Storage.ReadApp1
    target_backend: "azure_storage"
    allowed_containers:
      - "app1"
    allowed_actions:
      - "read"
    inputSchema:
      type: "object"
      properties:
        container:
          type: "string"
          enum: ["app1"]
          description: "Target Azure Blob Storage container (app1 only)"
        action:
          type: "string"
          enum: ["read"]
          description: "Storage action (strictly read)"
        filename:
          type: "string"
          description: "Name of the blob file to read"
      required:
        - "container"
        - "action"
        - "filename"
    fine_grained_policies:
      - id: "block_private_keys"
        description: "Prevents reading private key or credential blobs"
        effect: "DENY"
        condition: "args.filename.includes('key') || args.filename.includes('secret') || args.filename.includes('cred')"
        message: "Fine-Grained Policy Denial: Access to credential or private key files is strictly prohibited."

